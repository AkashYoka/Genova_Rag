version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Redis broker/result backend for Celery document processing
  redis:
    image: redis:7-alpine
    container_name: pdf_rag_redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MySQL 8.4 LTS Database ───────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: pdf_rag_mysql
    restart: unless-stopped
    logging: *default-logging
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --explicit_defaults_for_timestamp=ON
      --max-allowed-packet=64M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pdf_rag}
      MYSQL_USER: ${MYSQL_USER:-pdf_rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pdf_rag_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pdf_rag_root_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Legacy PostgreSQL (opt-in, migration window only) ────
  # Kept so the pre-migration stack can still be started to dump/verify
  # existing data before MySQL is promoted. Not started by default:
  #   docker compose --profile legacy-postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    container_name: pdf_rag_postgres
    restart: unless-stopped
    profiles: ["legacy-postgres"]
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_rag}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf_rag_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_rag_user} -d ${POSTGRES_DB:-pdf_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application (CPU profile) ────────────────────────────
  app:
    build: .
    container_name: pdf_rag_app
    profiles: ["cpu"]
    logging: *default-logging
    ports:
      - "7860:7860"
    volumes:
      - app_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdf_rag_user}:${MYSQL_PASSWORD:-pdf_rag_pass}@mysql:3306/${MYSQL_DATABASE:-pdf_rag}?charset=utf8mb4
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - GRAPH_PERSIST_DIR=/app/data/graphs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=cpu
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PDFS_PREFIX=${S3_PDFS_PREFIX:-pdfs}
      - S3_NOTES_PREFIX=${S3_NOTES_PREFIX:-sticky_notes}
      - S3_SERVER_SIDE_ENCRYPTION=${S3_SERVER_SIDE_ENCRYPTION:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Application (GPU profile) ────────────────────────────
  app-gpu:
    build: .
    container_name: pdf_rag_app
    profiles: ["gpu"]
    logging: *default-logging
    ports:
      - "7860:7860"
    volumes:
      - app_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdf_rag_user}:${MYSQL_PASSWORD:-pdf_rag_pass}@mysql:3306/${MYSQL_DATABASE:-pdf_rag}?charset=utf8mb4
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - GRAPH_PERSIST_DIR=/app/data/graphs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=cuda
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PDFS_PREFIX=${S3_PDFS_PREFIX:-pdfs}
      - S3_NOTES_PREFIX=${S3_NOTES_PREFIX:-sticky_notes}
      - S3_SERVER_SIDE_ENCRYPTION=${S3_SERVER_SIDE_ENCRYPTION:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery worker (CPU profile)
  worker:
    build: .
    container_name: pdf_rag_worker
    profiles: ["cpu"]
    logging: *default-logging
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    volumes:
      - app_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdf_rag_user}:${MYSQL_PASSWORD:-pdf_rag_pass}@mysql:3306/${MYSQL_DATABASE:-pdf_rag}?charset=utf8mb4
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - GRAPH_PERSIST_DIR=/app/data/graphs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=cpu
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PDFS_PREFIX=${S3_PDFS_PREFIX:-pdfs}
      - S3_NOTES_PREFIX=${S3_NOTES_PREFIX:-sticky_notes}
      - S3_SERVER_SIDE_ENCRYPTION=${S3_SERVER_SIDE_ENCRYPTION:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker (GPU profile)
  worker-gpu:
    build: .
    container_name: pdf_rag_worker
    profiles: ["gpu"]
    logging: *default-logging
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    volumes:
      - app_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdf_rag_user}:${MYSQL_PASSWORD:-pdf_rag_pass}@mysql:3306/${MYSQL_DATABASE:-pdf_rag}?charset=utf8mb4
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - GRAPH_PERSIST_DIR=/app/data/graphs
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=cuda
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PDFS_PREFIX=${S3_PDFS_PREFIX:-pdfs}
      - S3_NOTES_PREFIX=${S3_NOTES_PREFIX:-sticky_notes}
      - S3_SERVER_SIDE_ENCRYPTION=${S3_SERVER_SIDE_ENCRYPTION:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js static export served by nginx) ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7860}
    container_name: pdf_rag_frontend
    profiles: ["cpu", "gpu"]
    logging: *default-logging
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Adminer (optional — for local MySQL inspection) ──────
  adminer:
    image: adminer:latest
    container_name: pdf_rag_adminer
    restart: unless-stopped
    profiles: ["debug"]
    logging: *default-logging
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "5050:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  # Retained so the legacy PostgreSQL profile can still read pre-migration data.
  postgres_data:
  app_data:
