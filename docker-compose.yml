# Genova — local / ECS-parity stack
# Services: redis (Celery broker), app (API), worker (Celery), frontend (nginx)
# Database: Amazon RDS MySQL via DATABASE_URL (no local MySQL container)
# Object storage: Amazon S3 via env (IAM role or AWS_* credentials)
# LLM: Amazon Bedrock via env (AWS_BEARER_TOKEN_BEDROCK and/or IAM)
#
# Required in .env (see .env.example):
#   SECRET_KEY, FIELD_ENCRYPTION_KEY, DATABASE_URL
# Optional: S3_*, BEDROCK_*, AWS_*, OLLAMA_* (embeddings), NEXT_PUBLIC_API_URL
#
# Start:  docker compose up -d --build
# Data:   named volume app_data → /app/data (swap for EFS on ECS)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared env for API + worker (no secrets hardcoded)
x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your RDS MySQL URL}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  UPLOAD_DIR: /app/data/uploads
  CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/data/chroma_db}
  GRAPH_PERSIST_DIR: ${GRAPH_PERSIST_DIR:-/app/data/graphs}
  LOG_FILE: /app/data/logs/app.log
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
  BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_BASE_PREFIX: ${S3_BASE_PREFIX:-NoteBase}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_PDFS_PREFIX: ${S3_PDFS_PREFIX:-pdfs}
  S3_NOTES_PREFIX: ${S3_NOTES_PREFIX:-sticky_notes}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}

services:
  redis:
    image: redis:7-alpine
    container_name: pdf_rag_redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    image: genova_rag-app:latest
    container_name: pdf_rag_app
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${APP_PORT:-7860}:7860"
    volumes:
      # Local named volume; on ECS mount the same path from EFS
      - ${APP_DATA_MOUNT:-app_data}:/app/data
    environment:
      <<: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  worker:
    image: genova_rag-app:latest
    container_name: pdf_rag_worker
    restart: unless-stopped
    logging: *default-logging
    build: .
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
    volumes:
      - ${APP_DATA_MOUNT:-app_data}:/app/data
    environment:
      <<: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7860}
    image: genova_rag-frontend:latest
    container_name: pdf_rag_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  app_data:
  redis_data:
