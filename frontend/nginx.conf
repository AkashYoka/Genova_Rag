server {
    listen       3000;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # pdf.js ships a .mjs worker; Alpine nginx's default mime.types omits mjs,
    # so the file was served as application/octet-stream and browsers refused
    # to start the worker → react-pdf "Failed to load PDF".
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Content-Type application/javascript always;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;

    # ── Static asset caching ──────────────────────────────────────────────
    # Next.js hashes JS/CSS filenames — safe to cache aggressively
    location /_next/static/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── SPA fallback routing ──────────────────────────────────────────────
    # next export with output: "export" generates per-route .html files.
    # Try the exact file, then the directory index, then fall back to
    # index.html so client-side navigation works correctly.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Enforced CSP for Next.js static export + Google Identity Services.
    # 'unsafe-inline' is required for Next bootstrap; Google hosts for sign-in.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http://localhost:7860 http://127.0.0.1:7860 ws://localhost:7860 ws://127.0.0.1:7860 https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https: wss:; worker-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com;" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
}