# Local AWS feasibility overlay.
# Simulates ECR (prebuilt tags) + EFS (bind mount) + production env.
#
#   $env:MYSQL_PORT="3307"
#   $env:SECRET_KEY=(python -c "import secrets; print(secrets.token_urlsafe(32))")
#   $env:FIELD_ENCRYPTION_KEY=(python -c "import secrets; print(secrets.token_urlsafe(32))")
#   docker compose -f docker-compose.yml -f docker-compose.aws-feasibility.yml --profile cpu up -d --no-build
services:
  app:
    image: genova-api:aws-feasibility
    volumes:
      - ./.aws-feasibility-efs:/app/data
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000

  worker:
    image: genova-api:aws-feasibility
    volumes:
      - ./.aws-feasibility-efs:/app/data
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}

  frontend:
    image: genova-frontend:aws-feasibility
